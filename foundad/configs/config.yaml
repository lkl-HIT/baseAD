# configs/config.yaml
defaults:
  - _self_
  - app: train_dinov3 # merge/extend on top of app: default

diy_name: "_pretrained"

# train / AD
mode: train

# Experiment mode: periodic eval during training, no checkpoint saving
experiment:
  enabled: false
  eval_every_n_epochs: 100

data:
  batch_size: 8
  num_workers: 4
  pin_mem: true
  dataset: dataset-name
  data_name: fewshot-folder-name
  data_path: /path/to/fewshot-folder
  train_root: ${data.data_path}/${data.data_name}
  test_root: /path/to/dataset
  mvtec_classnames:                            
    - bottle
    - cable
    - capsule
    - carpet
    - grid
    - hazelnut
    - leather
    - metal_nut
    - pill
    - screw
    - tile
    - toothbrush
    - transistor
    - wood
    - zipper

  visa_classnames:                            
    - candle
    - capsules
    - cashew
    - chewinggum
    - fryum
    - macaroni1
    - macaroni2
    - pcb1
    - pcb2
    - pcb3
    - pcb4
    - pipe_fryum

  use_hflip: True
  use_vflip: True
  use_rotate90: True
  use_color_jitter: True
  use_gray: True
  use_blur: True

optimization:
  weight_decay: 1e-4
  epochs: 2000
  # Write train-step{N}.pth.tar every N global optimizer steps (not per-epoch itr). 0 = disable.
  save_every_steps: 1000
  lr: 0.001
  lr_config: const # const, cosine, step, cosine_warmup
  min_lr: 1e-4 # for cosine and cosine_warmup
  warmup_epoch: 100 # cosine_warmup
  step_size: 300 # step
  gamma: 0.1 # step
  
  

testing:
  K_top_mvtec: 10    
  K_top_visa: 6         
  expect_fpr: 0.3     
  max_steps: 200      
  segmentation_vis: True
  # Resume AD eval: skip classes already present in *_eval.csv for this checkpoint
  skip_evaluated_classes: true
  # Top-ratio aggregation: overrides K_top if set (e.g. 0.01 = top 1%)
  top_ratio: null
  # PCA auxiliary scoring (inference-only, works with existing checkpoints)
  pca:
    enabled: false
    ev_ratio: 0.99        # explained variance threshold for selecting PCA components
    score_weight: 0.3     # fusion weight for PCA score (0 = FoundAD only, 1 = PCA only)
    n_aug: 3              # rotation augmentations per training image for PCA fitting

devices: [cuda:0]

dist:
  master_addr: localhost
  master_port: 40112
  backend: nccl

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
